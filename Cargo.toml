[package]
name = "bitcoin-wallet"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "wallet"
path = "src/main.rs"

[dependencies]
bdk = { version = "0.29", features = ["electrum", "keys-bip39"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
zeroize = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
proptest = "1"
